name: Generate tech radar edition

on:
  workflow_dispatch:
    inputs:
      runDate:
        description: Optional ISO date override for the generated edition draft
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run-edition-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify OpenAI secret is configured
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck edition agent
        working-directory: tooling/tech-radar-edition-agent
        run: bun run typecheck

      - name: Generate edition file
        working-directory: tooling/tech-radar-edition-agent
        env:
          RUN_DATE: ${{ inputs.runDate }}
          EDITION_RUN_ID: edition-${{ github.run_id }}
        run: |
          bun run generate:edition

      - name: Read generation metadata
        id: edition_metadata
        working-directory: tooling/tech-radar-edition-agent
        run: |
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";

          const result = JSON.parse(
            readFileSync(".generated/edition-agent-result.json", "utf8"),
          );

          const writeOutput = (name, value) => {
            console.log(`${name}<<EOF`);
            console.log(String(value));
            console.log("EOF");
          };

          writeOutput("edition_file", result.filePath);
          writeOutput("edition_file_name", result.fileName);
          writeOutput("edition_number", result.editionNumber);
          writeOutput("edition_title", result.title);
          EOF

      - name: Upload generated edition artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edition-agent-output
          path: |
            tooling/tech-radar-edition-agent/.generated/edition-agent-output.txt
            tooling/tech-radar-edition-agent/.generated/edition-agent-result.json
            ${{ steps.edition_metadata.outputs.edition_file }}

      - name: Create pull request for generated edition
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat: generate tech radar edition ${{ steps.edition_metadata.outputs.edition_number }}"
          branch: "automation/edition-${{ github.run_id }}"
          delete-branch: true
          title: "feat: generate ${{ steps.edition_metadata.outputs.edition_title }}"
          body: |
            ## Generated edition draft

            This pull request was created automatically by the edition agent workflow.

            - Edition: `${{ steps.edition_metadata.outputs.edition_number }}`
            - File: `${{ steps.edition_metadata.outputs.edition_file_name }}`
            - Workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            The generated MDX file includes deterministic metadata plus AI-authored narrative sections with provenance.
          add-paths: |
            ${{ steps.edition_metadata.outputs.edition_file }}
