# https://moonrepo.dev/docs/config/workspace
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
- tooling/*
- apps/*
- packages/*

vcs:
  client: 'git'
  provider: 'github'
  hooks:
    pre-commit:
      - 'moon run biome-config:check --affected --status=staged'
  sync: true

# Enable code ownership functionality
codeowners:
  sync: true
  globalPaths:
    '*': ['@tech-radar-admins']